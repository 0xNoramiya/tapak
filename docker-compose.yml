# Two services. Both run as the unprivileged user "tapak" (uid 10001).
#
# app        web UI on 127.0.0.1:8000 of the host; holds ./data and ./keys.
# canary-dns the only internet-facing part. It sees nothing but ./data/kanari (its event
#            log, writable) and ./data/kanari-izin (digests of issued tokens, read-only),
#            listens on 5353 inside the container (no root needed) and is published on
#            port 53 of the host. It sits on its own network, so it cannot reach the web app.
#
# Prepare once on the host: tapak keys init   (keys/ is mounted into the app only)
#   mkdir -p data/kanari data/kanari-izin && sudo chown -R 10001 data keys
#
# Optional, with defaults that keep the setup above unchanged:
#   TAPAK_IMAGE        image tag (default tapak:latest)
#   TAPAK_PORT         host port of the web UI on 127.0.0.1 (default 8000)
#   TAPAK_CANARY_PORT  host port of the canary listener, UDP and TCP (default 53)
# External anchor log: add docker-compose.jangkar.yml (see that file and docs/operasi.md).
services:
  app:
    build: .
    image: ${TAPAK_IMAGE:-tapak:latest}
    ports:
      - "127.0.0.1:${TAPAK_PORT:-8000}:8000"
    volumes:
      - ./data:/data
      - ./keys:/keys
    environment:
      TAPAK_CANARY_DOMAIN: ${TAPAK_CANARY_DOMAIN:-kanari.tapak.test}
      TAPAK_LLM: ${TAPAK_LLM:-mock}
    networks: [web]
    restart: unless-stopped

  canary-dns:
    image: ${TAPAK_IMAGE:-tapak:latest}
    depends_on:
      - app
    command: >
      python -m tapak.canary_dns
      --domain ${TAPAK_CANARY_DOMAIN:-kanari.tapak.test}
      --db /data/kanari/kanari.db
      --allowlist /data/kanari-izin/token_digests.txt
      --host 0.0.0.0 --port 5353
      --answer-ip ${TAPAK_CANARY_ANSWER_IP:-127.0.0.1}
    environment:
      # Public IPv4 of this listener (same as the registrar glue record for ns1.<domain>).
      TAPAK_CANARY_NS_IP: ${TAPAK_CANARY_NS_IP:-}
    ports:
      - "${TAPAK_CANARY_PORT:-53}:5353/udp"
      - "${TAPAK_CANARY_PORT:-53}:5353/tcp"
    volumes:
      - ./data/kanari:/data/kanari
      - ./data/kanari-izin:/data/kanari-izin:ro
    networks: [kanari]
    restart: unless-stopped

networks:
  web: {}
  kanari: {}
